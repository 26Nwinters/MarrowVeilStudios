name: Publish searchable devlog snapshots
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: write
jobs:
  export:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export only published CMS articles
        run: node scripts/export-blog.mjs
      - name: Validate generated pages
        run: node --test scripts/site-quality.test.mjs
      - name: Commit published snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- articles/ blog.html blog/index.html feed.xml sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Publish updated static devlog snapshots"
            git push
          fi
