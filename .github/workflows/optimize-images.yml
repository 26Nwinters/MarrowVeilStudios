name: Generate optimized website images
on:
  push:
    branches: ['optimize/**']
    paths:
      - 'assets/**'
      - 'scripts/optimize_images.py'
      - '.github/workflows/optimize-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tooling
        run: python -m pip install Pillow==11.3.0
      - name: Generate WebP variants and update page references
        run: python scripts/optimize_images.py
      - name: Commit optimized assets back to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ docs/image-optimization-report.json '*.html' style.css
          if ! git diff --cached --quiet; then
            git commit -m "Generate WebP variants and optimize page image references"
            git push
          fi
